[project]
name = "efah"
version = "0.1.0"
description = "Evidence-First Cross-Vendor Engineering Harness and Eval Lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-sqlite>=2.0",
  "aiosqlite>=0.20",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28",
  "PyJWT>=2.7",
  "cryptography>=41",
]

[project.scripts]
harness = "cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {"" = "src"}
