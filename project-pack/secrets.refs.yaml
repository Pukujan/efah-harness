# secrets.refs.yaml — REFERENCES ONLY. NEVER VALUES.
# Contract: EFAH-CONTRACT-001 v1.0 · Section 6
#
# ###########################################################################
# #  Every field below is a NAME or PATH pointing at a secret held          #
# #  elsewhere (env var, keychain, GitHub secret, vault path).              #
# #  If you paste an actual key into this file it will be committed to git  #
# #  and the provenance gate will have recorded a leaked credential in an   #
# #  immutable TerminusDB commit. Do not.                                   #
# ###########################################################################

schema_id: efah.secrets_refs
schema_version: "1.0"
contract_id: EFAH-CONTRACT-001
contract_version: "1.0"

# Recorded 2026-08-01: env. Simplest thing that works on a single host, and it
# matches how the ckff proxy already resolves its CKFF_* keys.
resolution_backend: env

refs:
  # --- model gateway: production ---
  litellm_key:
    ref: env:LITELLM_MASTER_KEY
    required: true
    used_by: [model_router, candidate_production_worker_sessions]
    gateway: production
    blocker_if_missing: MISSING_REQUIRED_CREDENTIAL

  # --- model gateway: eval (SEPARATE master key, not production's) ---
  litellm_eval_key:
    ref: env:LITELLM_EVAL_MASTER_KEY
    required: true
    used_by: [all_gate_bearing_roles, holdout_runs, mutant_runs, oracle_runs]
    gateway: eval
    # The eval service is DB-less and holds its own master key precisely so it
    # cannot reach production's virtual-key store. Reusing the production key
    # here would collapse that separation.
    must_not_equal: secrets.litellm_key
    blocker_if_missing: MISSING_REQUIRED_CREDENTIAL

  # --- authoritative graph ---
  terminusdb_auth:
    ref: env:TERMINUSDB_ADMIN_PASS
    required: true
    used_by: [control_plane, provenance, ledgers]
    blocker_if_missing: MISSING_REQUIRED_CREDENTIAL

  terminusdb_protected_auth:
    # Contract Section 11.2 — the protected model-identity database uses
    # SEPARATE credentials from the main graph. Task participants never hold
    # this one; only the owner audit path does.
    ref: env:TERMINUSDB_PROTECTED_PASS
    required: true
    used_by: [owner_audit_path]
    withheld_from: [all_task_participants, all_worker_sessions]
    blocker_if_missing: MISSING_REQUIRED_CREDENTIAL

  # --- projection ---
  plane_api_key:
    ref: env:PLANE_API_KEY
    required: true
    used_by: [plane_projection_adapter]
    # Plane is a projection; its absence degrades visibility, it does not
    # invalidate the run. Still required for acceptance check
    # plane_project_and_assurance_views.
    blocker_if_missing: MISSING_REQUIRED_CREDENTIAL

  # --- release authority ---
  github_app_or_pat:
    ref: env:GITHUB_APP_PRIVATE_KEY
    required: true
    used_by: [auto_open_pr, auto_repair_ci, auto_merge]
    # The default GITHUB_TOKEN does NOT trigger CI on its own PRs. Using it
    # silently breaks auto_repair_ci and auto_merge — the PR sits green-less
    # forever and the run stalls without a typed failure.
    must_not_be: default_github_actions_token
    scope_must_exclude: [efah-lab-verifier, Eval-lab-verifier]
    blocker_if_missing: MISSING_REQUIRED_CREDENTIAL

  # --- documentation ---
  context7_key_1:
    ref: env:CONTEXT7_KEY_1
    required: true
    credential_alias: primary
    used_by: [context7_snapshot_cache]
    blocker_if_missing: MISSING_REQUIRED_CREDENTIAL

  context7_key_2:
    ref: env:CONTEXT7_KEY_2
    required: true
    credential_alias: secondary
    used_by: [context7_snapshot_cache]
    # Capacity/failover only — NOT an independent evidence source.
    independent_evidence_source: false
    blocker_if_missing: MISSING_REQUIRED_CREDENTIAL

  # --- optional / conditional ---
  object_storage_credentials:
    ref: env:OBJECT_STORAGE_CREDENTIALS
    required: false                 # not required if object_storage.mode is local_filesystem
    used_by: [artifact_registry]

  otel_exporter_headers:
    ref: env:OTEL_EXPORTER_HEADERS
    required: false                 # not required for a local collector
    used_by: [observability]

# ---------------------------------------------------------------------------
# SEALED SIDE — deliberately empty
# ---------------------------------------------------------------------------
# The verifier's repository token, database credentials, and oracle internals
# are held by the separate verifier service identity and MUST NOT appear here
# in any form, including as a reference. A ref name alone is a route.
#
# Contract acceptance_check: protected_verifier_isolation
# Contract role_separation: implementer_no_sealed_holdout_access
sealed_side_refs: {}

isolation_assertions:
  - no_ref_resolves_to_sealed_repo_or_service: true
  - builder_identity_cannot_read_list_clone_or_query_verifier: true
  - protected_identity_db_credential_withheld_from_workers: true
