# model-policy.yaml — deterministic routing, blinded aliases, role separation
# Contract: EFAH-CONTRACT-001 v1.0 · Sections 11.1, 11.2, 12
#
# Populated 2026-08-01 from the owner's measured ckff LiteLLM inventory
# (MODELS.md, EVALLAB.md, EVALENDPOINT.md, CONFIGURATIONGUIDE.md).
# Every latency, price, and tool-reliability figure below is measured, not
# quoted from a pricing table.
#
# The model router is a DETERMINISTIC POLICY SERVICE, not an orchestrator.
# It returns an alias and a configuration version. Agents never receive the
# real vendor or model identity (contract Section 12.3).

schema_id: efah.model_policy
schema_version: "1.0"
contract_id: EFAH-CONTRACT-001
contract_version: "1.0"

router:
  deterministic_policy: true
  uses_existing_litellm_config: true
  redesign_provider_access: false
  blinded_aliases: true
  availability_requires_empirical_probe: true
  protected_identity_database: separate_terminusdb_database_or_instance
  factors:
    - required_role
    - capabilities
    - calibration
    - family_separation
    - role_conflicts
    - risk
    - context_requirement
    - tool_requirement
    - retry_and_fallback_policy
    - gateway_class          # added: see gateway_routing below

# ===========================================================================
# GATEWAY ROUTING — the most consequential decision in this file
# ===========================================================================
# The owner runs TWO LiteLLM deployments. They are the same binary with
# opposite policies, and routing a role to the wrong one silently corrupts
# evidence rather than failing.
#
#   production  retries 5+5, up to 3 pooled routes per alias, cooldowns on,
#               drop_params true, max_parallel_requests 8
#   eval        retries 0+0, exactly 1 route per alias, cooldowns disabled,
#               drop_params false, no request queueing, DB-less, separate key
#
# Per the owner's own operating guide: "Never collect evaluation evidence
# through the production gateway. It retries, pools, and silently strips
# params." Pooling is a hidden retry that never appears in num_retries; a
# failed call silently re-rolls onto another key.
#
# The EFAH contract makes this binding rather than advisory. Section 18
# requires every model run to record a configuration hash and input/output
# hashes; Section 17.4 requires oracles to have a deterministic verdict path.
# A gateway that silently retries, re-routes, or strips reasoning_effort makes
# both unprovable — the recorded configuration is not the one that ran.
#
# Therefore: every role whose output feeds a GATE routes through the eval
# gateway. Roles that merely produce candidate work route through production,
# where retries and failover are desirable.
gateway_routing:
  production:
    base_url_ref: environments.dev.litellm_production.base_url
    rationale: retries_and_failover_are_desirable_for_candidate_production
    permitted_roles:
      [researcher, research_challenger, planner, plan_challenger,
       implementer, integration_verifier]
  eval:
    base_url_ref: environments.dev.litellm_eval.base_url
    rationale: zero_hidden_retry_required_for_gate_bearing_evidence
    permitted_roles:
      [visible_test_author, sealed_holdout_author, mutant_author, oracle_author,
       adversarial_critic, judge, evidence_auditor,
       contract_compliance_auditor, release_verifier]
    client_requirements:
      # The proxy cannot stop a client from retrying. OpenAI and Anthropic SDKs
      # both default to max_retries=2, and urllib3.Retry / most HTTPAdapter
      # presets retry by default. An un-pinned shared session voids the
      # zero-retry guarantee from outside the proxy.
      sdk_max_retries: 0
      sdk_timeout_seconds: 120
      curl_retry_flag: forbidden
      check_shared_session_objects: true
    preflight_required: true
    preflight_command: python validate_eval_config.py --url <eval_base_url>
    preflight_must_exit: 0
    # The live half calls __canary_invalid and asserts it fails FAST (measured
    # 1.22s vs >=10s with retries) and returns an error rather than a 200.
    # A 200 would mean something silently fell back.
  violation_state: FAILED_PROVENANCE

# ===========================================================================
# Role -> alias map
# ===========================================================================
# Constraints satisfied here, checked mechanically by validate_pack.py:
#   implementer != sealed_holdout_author  (alias AND family)
#   implementer != judge                  (alias AND family)
#   implementer != adversarial_critic     (alias AND family)
#   implementer != visible_test_author    (alias)
#   implementer != mutant_author          (alias)
#
# Tiering per owner decision 2026-08-01: frontier for assurance, mid for bulk.
# Assurance is where a wrong answer costs the most, so capability goes there.
#
# Six vendor families are usable. Three more (Zhipu/Moonshot/MiniMax via the
# [aws]* flat-rate lane) are excluded below because that entire channel was
# returning 503 at pack time — see availability_probe.

aliases:
  # --- production side: candidate work, mid-tier, retries desirable ---
  researcher:
    alias: researcher-r17
    litellm_model: gpt-5.6-sol
    family: openai
    gateway: production
    tier: mid
    measured: {median_latency_s: 1.4, price: "$2.50/$15.00 per M", tools: "3/3"}

  research_challenger:
    alias: challenger-x02
    litellm_model: "[grok] grok-4.5"
    family: xai
    gateway: production
    tier: mid
    # Cross-family from researcher. Flat $0.004/call — the same model as the
    # per-token `grok-4.5` alias, ~25000x cheaper on a 50k-token prompt.
    measured: {median_latency_s: 3.3, price: "FLAT $0.004/call", tools: "3/3"}

  planner:
    alias: planner-p04
    litellm_model: claude-opus-5-thinking
    family: anthropic
    gateway: production
    tier: frontier
    measured: {median_latency_s: 1.2, price: "$0.25/$1.50 per M", tools: "3/3"}

  plan_challenger:
    alias: planchal-q06
    litellm_model: "[ds2] deepseek-v4-pro"
    family: deepseek
    gateway: production
    tier: mid
    # Cross-family from planner. Use the [ds2] route, not the [三方4] one,
    # which hits a 429 daily quota.
    measured: {median_latency_s: 1.9, price: "$0.43/$0.87 per M", tools: "3/3"}

  implementer:
    alias: implementer-i12
    litellm_model: gpt-5.6-luna
    family: openai
    gateway: production
    tier: mid
    # Chosen for the tightest latency distribution in the codex family
    # (1.7s median, 7.9s worst) rather than the best median. Highest-volume
    # role in the system, so variance matters more than peak capability.
    # Pinned to codex-pro alone upstream — it timed out >150s on plus and CC.
    measured: {median_latency_s: 1.7, worst_s: 7.9, price: "$1.00/$6.00 per M", tools: "3/3"}

  integration_verifier:
    alias: wiring-w05
    litellm_model: kimi-k2.7-code
    family: moonshot
    gateway: production
    tier: frontier
    measured: {median_latency_s: 2.8, price: "$0.10/$0.20 per M", tools: "3/3"}

  # --- assurance side: gate-bearing, frontier, eval gateway, zero retry ---
  visible_test_author:
    alias: testauthor-t09
    litellm_model: claude-opus-4-7
    family: anthropic
    gateway: eval
    tier: frontier
    measured: {median_latency_s: 1.3, price: "$5.00/$25.00 per M", tools: "3/3"}
    quirk: rejects_reasoning_effort_400

  sealed_holdout_author:
    alias: holdout-h01
    litellm_model: claude-opus-4-8
    family: anthropic
    gateway: eval
    tier: frontier
    # Runs under the VERIFIER service identity, not the builder's. Its output
    # is written into Eval-lab-verifier and is never readable by the
    # implementer. Owner authorized role-separated generation 2026-08-01.
    runs_under_identity: verifier_service_identity
    measured: {median_latency_s: 2.7, price: "$5.00/$25.00 per M", tools: "3/3"}
    quirk: rejects_reasoning_effort_400

  mutant_author:
    alias: mutant-m03
    litellm_model: kimi-k2.7-code
    family: moonshot
    gateway: eval
    tier: frontier
    runs_under_identity: verifier_service_identity
    measured: {median_latency_s: 1.2, price: "$1.50/$9.00 per M", tools: "3/3"}

  oracle_author:
    alias: oracle-o02
    litellm_model: qwen-3.6-max
    family: qwen
    gateway: eval
    tier: frontier
    measured: {median_latency_s: 5.2, price: "$1.30/$7.80 per M", tools: "3/3"}

  adversarial_critic:
    alias: critic-c08
    litellm_model: "[grok] grok-4.5"
    family: xai
    gateway: eval
    tier: frontier
    # Cross-family from implementer (openai). Flat rate makes long-context
    # refutation affordable, which matters — a critic given a truncated
    # artifact produces a weak refutation.
    measured: {median_latency_s: 3.3, price: "FLAT $0.004/call", tools: "3/3"}

  judge:
    alias: judge-j03
    litellm_model: "[ds2] deepseek-v4-pro"
    family: deepseek
    gateway: eval
    tier: frontier
    # Cross-family from implementer. ADVISORY ONLY until calibrated — see
    # judge_calibration below.
    measured: {median_latency_s: 1.9, price: "$0.43/$0.87 per M", tools: "3/3"}

  evidence_auditor:
    alias: auditor-a07
    litellm_model: glm-5.2
    family: zhipu
    gateway: eval
    tier: frontier
    measured: {median_latency_s: 1.9, price: "$0.14/$0.28 per M", tools: "3/3"}

  contract_compliance_auditor:
    alias: compliance-k01
    litellm_model: claude-sonnet-5
    family: anthropic
    gateway: eval
    tier: frontier
    measured: {median_latency_s: 1.9, price: "$3.00/$15.00 per M", tools: "3/3"}
    quirk: rejects_reasoning_effort_400

  release_verifier:
    alias: release-v04
    litellm_model: glm-5-turbo
    family: zhipu
    gateway: eval
    tier: frontier
    # Seventh family, and deliberately not openai — the release verifier
    # should not share a family with the implementer whose work it clears.
    # Note this is the `kimi` key group route, NOT the [aws] flat lane, which
    # was 503 at pack time.
    measured: {median_latency_s: 3.4, price: "$1.20/$4.00 per M", tools: "3/3"}

# ===========================================================================
# Prohibited models, with measured reasons
# ===========================================================================
# The router MUST NOT select these regardless of availability. Each exclusion
# is evidence-backed, not preference.
prohibited_models:
  - model: claude-opus-5
    reason: cost_trap
    detail: >
      Lists at $75/$75 per M — 15x the next most expensive model. It billed
      ~$0 historically on the kiro-pro channel, but that is channel behaviour
      that can change, and the exposure is unbounded if it does. Use
      claude-opus-5-thinking (flat $0.048, same generation, and it accepts
      reasoning_effort) if an Anthropic frontier model is needed beyond
      opus-4-7/4-8.
  - model: "[官4][次] glm-5.2"
    reason: cost_trap
    detail: "FLAT $0.080/call — 20x the [aws] rate and the single most expensive thing measured."
  - model: gpt-5.4
    reason: channel_outage
    detail: "503 Service temporarily unavailable, 0/3 across two independent runs."
  - model: gpt-5.4-mini
    reason: channel_outage
  - model: minimax-m3
    reason: streaming_tool_call_gap
    detail: "Emits tool calls only non-streaming. A streaming client sees none — a silent capability hole."
  - model: mimo-v2.5-pro
    reason: intermittent_tool_calling
  - model: "[不稳定渠道] *"
    reason: unstable_channel
    detail: "Channel is literally named 'unstable'; 19-66s latencies measured."

# ---------------------------------------------------------------------------
# REQUALIFIED 2026-08-02 — prohibitions lifted on measurement, by owner directive
# ---------------------------------------------------------------------------
# Two entries were removed from the list above. They are recorded here rather
# than deleted, because a prohibition that vanishes without a trace is
# indistinguishable from one that was never made.
#
# The owner reported using both successfully elsewhere. Section 7.2 resolves a
# recorded decision against a live empirical fact with a fresh probe, not by
# preferring whichever is written down — and there was specific reason to
# distrust the originals: MODELS.md already records one tool-calling audit being
# overturned, with the earlier failures found to be "measurement artifacts from
# insufficient max_tokens".
#
# Re-probed with tools/requalify_model.py: 5 repetitions per condition, both
# streaming and non-streaming, max_tokens 1024, paced at 1.6s to avoid the
# self-inflicted 503s of FINDING-008. Evidence:
# evidence/model-requalification.json
requalified:
  - model: gpt-5.6-sol
    was: latency_variance
    claim_was: "4.7s median but 119.4s worst observed."
    measured: "10/10 success, tool calls 10/10, p50 2.4s, MAX 4.8s across both modes."
    verdict: not_reproduced
    caveat: >
      The original claim is about a distribution and 10 samples cannot prove a
      119.4s tail is gone, only that it did not appear. Watch it on any
      timeout-bounded path.
  - model: kimi-k2.7-code
    was: intermittent_tool_calling
    measured: "10/10 success, tool calls 10/10, streaming and non-streaming alike."
    verdict: not_reproduced
    caveat: >
      Consistent with the max_tokens artifact MODELS.md already identified once.
      The original probe's token budget is not recorded, so the artifact is the
      likeliest explanation rather than a proven one.

# Excluded at pack time by availability, not capability. The router's
# empirical probe governs — if the channel returns, these become eligible.
degraded_at_pack_time:
  models:
    - "[aws]glm-5"
    - "[aws]glm-4.7"
    - "[aws]kimi-k2-thinking"
    - "[aws]minimax-m2.5"
    - "[aws]deepseek-v3.2"
  note: >
    The entire flat-rate $0.008 lane returned 503 No available channel on
    2026-08-01, having worked earlier the same day. This is why
    availability_requires_empirical_probe is true: a static config that
    assumed these were up would have failed at runtime with no typed cause.
    It also removes Zhipu, Moonshot, and MiniMax as usable families, which is
    why the role map above draws on six families rather than nine.

# ===========================================================================
# Request discipline — measured traps that produce false evidence
# ===========================================================================
request_policy:
  # Reasoning models emit reasoning_content BEFORE tool_calls. A low max_tokens
  # truncates the response before the tool call is ever produced, and the model
  # looks like it lacks tool support. This produced eleven false negatives in
  # the owner's own benchmark; a re-audit found 45/45 reachable models emit tool
  # calls and zero do not.
  min_max_tokens_for_tool_calls: 512
  hard_floor_max_tokens: 256
  violation_state: FAILED_ORACLE

  # ckff enforces 100 requests per MINUTE account-wide. It is a rate limit, not
  # a per-model concurrency limit, and it counts every request regardless of
  # which model it hits. Spreading load across models was tested at N=10 in
  # four conditions and does NOT help — only slowing down does.
  global_throttle_required: true
  global_throttle_max_requests_per_minute: 90     # headroom under the 100 cap
  global_throttle_min_interval_seconds: 0.9
  throttle_scope: account_wide_not_per_model
  # An unthrottled parallel sweep self-inflicts 429s that are indistinguishable
  # from genuine model failure. Any 429 from the eval gateway is real evidence;
  # any 429 caused by our own fan-out is fabricated evidence.
  unthrottled_fanout: forbidden

  prefer_streaming: true
  streaming_rationale: better_TTFB_and_avoids_proxy_timeouts_on_long_generations

  # reasoning_effort is a request PARAMETER, not a model id. On the production
  # gateway drop_params:true strips it silently, so an experiment can record a
  # setting that was never applied. The eval gateway sets drop_params:false so
  # an unsupported param is a loud 400.
  reasoning_effort:
    is_parameter_not_model_id: true
    verified_accepting: [gpt-5.5, gpt-5.6-terra]
    rejects_with_400: [claude-opus-4-7, claude-opus-5, claude-sonnet-5]
    must_verify_per_model_on_eval_gateway: true

# ===========================================================================
# Incompatibility rules — enforced mechanically, not by agent judgment
# ===========================================================================
role_incompatibilities:
  - roles: [implementer, sealed_holdout_author]
    rule: must_differ_by_agent_and_family
    satisfied_by: "openai/gpt-5.6-luna vs anthropic/claude-opus-4-8"
    contract_ref: role_separation.builder_ne_holdout_author
  - roles: [implementer, judge]
    rule: must_differ_by_agent_and_family
    satisfied_by: "openai/gpt-5.6-luna vs deepseek/deepseek-v4-pro"
    contract_ref: role_separation.builder_ne_final_adjudicator
  - roles: [implementer, adversarial_critic]
    rule: must_differ_by_family
    satisfied_by: "openai/gpt-5.6-luna vs xai/grok-4.5"
    contract_ref: role_separation.producer_not_sole_reviewer
  - roles: [visible_test_author, implementer]
    rule: must_differ_by_agent
    satisfied_by: "anthropic/claude-opus-4-7 vs openai/gpt-5.6-luna"
    contract_ref: contract_section_14.3_test_first_behavior
  - roles: [mutant_author, implementer]
    rule: must_differ_by_agent
    satisfied_by: "google/gemini-3.5-flash vs openai/gpt-5.6-luna"
    contract_ref: contract_section_17.1
  - roles: [researcher, research_challenger]
    rule: should_differ_by_family
    satisfied_by: "openai vs xai"
  - roles: [planner, plan_challenger]
    rule: should_differ_by_family
    satisfied_by: "google vs deepseek"

# ===========================================================================
# Hard limits on model authority
# ===========================================================================
authority_limits:
  cross_vendor_agreement_is_proof: false
  uncalibrated_judge_is_gate: false
  deterministic_oracle_preferred_over_model_judge: true
  model_judge_in_deterministic_verdict_path: forbidden
  model_voting_as_correctness: forbidden   # contract non_goals

# Contract Section 17.5 — a judge is qualified per
# model version x domain x rubric version.
judge_calibration:
  required_before_gate_authority: true
  required_records:
    - sample_size
    - gold_provenance
    - agreement_measure
    - exact_accuracy
    - false_pass_rate
    - false_fail_rate
    - abstention_rate
    - confusion_matrix
    - confidence_interval
    - family_bias_notes
    - recalibration_triggers
  # OWNER DECISION 2026-08-01: left unset deliberately. With no threshold,
  # every judge stays ADVISORY and the deterministic oracles carry the gates.
  # That is the correct posture for a 48-hour build — calibrating a judge
  # properly needs a gold corpus that does not exist yet, and an uncalibrated
  # judge given gate authority is worse than no judge at all.
  minimum_agreement_to_gate: null
  posture: all_judges_advisory_for_deadline_build
  recorded_as: honest_debt

session_policy:
  fresh_per_invocation_worker_sessions: true
  persistent_model_conversation_memory_default: false
  durable_state_location: terminusdb_and_git_and_checkpoints
  chat_transcript_as_project_memory: forbidden

retry_and_fallback:
  classify_before_retry: true
  failure_classes:
    - TRANSIENT_PROVIDER_FAILURE
    - RATE_LIMIT
    - MODEL_UNAVAILABLE
    - WORKER_CONTEXT_LIMIT
    - TOOL_FAILURE
    - TEST_FAILURE
    - WIRING_FAILURE
    - CONTRACT_DRIFT
    - HOLDOUT_FAILURE
    - ORACLE_INVALID
    - PROTECTED_ACCESS
    - INFRASTRUCTURE_FAILURE
  fallback_preserves_family_separation: true
  max_retries_per_work_unit: 3
  # Beyond three the failure is structural, not transient — route to
  # REWORK_REQUIRED rather than attempting a fourth time.
  on_exhaustion: REWORK_REQUIRED
  # Retries happen at the HARNESS layer with typed classification, never
  # silently inside the eval gateway. A 429 or 503 from the eval gateway is
  # recorded as evidence before any harness-level retry is considered.
  gateway_level_retry_on_eval_path: forbidden

availability_probe:
  required_before_first_dispatch: true
  # The [aws] lane was up in the morning and 503 by afternoon on the same day.
  # A static assumption of availability is not evidence.
  probe_all_mapped_aliases: true
  probe_max_tokens: 512
  probe_includes_tool_call: true
  on_unavailable: select_declared_fallback_preserving_family_separation
  record_as: ModelCapability
